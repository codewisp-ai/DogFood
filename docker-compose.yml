
x-common-env: &common-env
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood
  SPRING_DATASOURCE_USERNAME: dogfood_app
  SPRING_DATASOURCE_PASSWORD: dogfood_secret
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: dogfood
  SPRING_RABBITMQ_PASSWORD: dogfood
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: dogfood
  MINIO_SECRET_KEY: dogfood_secret

services:
  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood_admin
      POSTGRES_PASSWORD: dogfood_admin_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood_admin -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dogfood
      RABBITMQ_DEFAULT_PASS: dogfood
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dogfood
      MINIO_ROOT_PASSWORD: dogfood_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: elestio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dogfood http://minio:9000 dogfood dogfood_secret &&
      mc mb --ignore-existing dogfood/submissions &&
      mc mb --ignore-existing dogfood/certificates &&
      mc mb --ignore-existing dogfood/avatars &&
      mc anonymous set download dogfood/submissions &&
      echo 'MinIO buckets initialized'
      "

  # ── Flyway Migrations (one-shot init containers) ───────────────
  flyway-auth:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/identity/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: auth
      FLYWAY_DEFAULT_SCHEMA: auth
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-events:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/event/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: events
      FLYWAY_DEFAULT_SCHEMA: events
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-submissions:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/submission/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: submissions
      FLYWAY_DEFAULT_SCHEMA: submissions
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-judging:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/judging/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: judging
      FLYWAY_DEFAULT_SCHEMA: judging
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-voting:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/voting/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: voting
      FLYWAY_DEFAULT_SCHEMA: voting
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-audit:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/observability/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: audit
      FLYWAY_DEFAULT_SCHEMA: audit
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-notifications:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/notification/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: notifications
      FLYWAY_DEFAULT_SCHEMA: notifications
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  flyway-webhooks:
    image: flyway/flyway:10
    command: migrate
    volumes:
      - ./services/webhook-dispatcher/src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/dogfood
      FLYWAY_SCHEMAS: webhooks
      FLYWAY_DEFAULT_SCHEMA: webhooks
      FLYWAY_USER: dogfood_admin
      FLYWAY_PASSWORD: dogfood_admin_secret
      FLYWAY_CREATE_SCHEMAS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend Services ───────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: identity-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=auth
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - cert_keys:/app/keys
    depends_on:
      flyway-auth:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  event-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: event-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=events
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      flyway-events:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  submission-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: submission-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=submissions
      SERVER_PORT: 8083
      EVENT_SERVICE_URL: http://event-service:8082
    ports:
      - "8083:8083"
    depends_on:
      flyway-submissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  judging-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: judging-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=judging
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      flyway-judging:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  voting-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: voting-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=voting
      SERVER_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      flyway-voting:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=notifications
      SERVER_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      flyway-notifications:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  webhook-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: webhook-dispatcher
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=webhooks
      SERVER_PORT: 8087
    ports:
      - "8087:8087"
    depends_on:
      flyway-webhooks:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  certificate-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: certificate-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SERVER_PORT: 8088
    ports:
      - "8088:8088"
    volumes:
      - cert_keys:/app/keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  observability-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: observability-service
    environment:
      <<: *common-env
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dogfood?currentSchema=audit
      SERVER_PORT: 8089
    ports:
      - "8089:8089"
    depends_on:
      flyway-audit:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API Gateway ────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      SUBMISSION_SERVICE_URL: http://submission-service:8083
      JUDGING_SERVICE_URL: http://judging-service:8084
      VOTING_SERVICE_URL: http://voting-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      WEBHOOK_SERVICE_URL: http://webhook-dispatcher:8087
      CERTIFICATE_SERVICE_URL: http://certificate-service:8088
      OBSERVABILITY_SERVICE_URL: http://observability-service:8089
      JWT_PUBLIC_KEY_URL: http://identity-service:8081/api/auth/.well-known/jwks.json
    ports:
      - "8080:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      submission-service:
        condition: service_healthy
      judging-service:
        condition: service_healthy
      voting-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

  # ── Auto Database Seeder (Rule 02 Compliance) ─────────────────
  db-seeder:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./infra/seed-fixtures.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c", "sleep 3 && PGPASSWORD=dogfood_admin psql -h postgres -U dogfood_admin -d dogfood -f /seed.sql || true"]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  cert_keys:
